; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:esp32dev]
; Platform version ko 6.5.0 (ESP32 Arduino Core 2.0.14) par lock kiya gaya hai
; Ye standard Ethernet library aur production stability ke liye best hai
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; Serial Monitor speed; crash hone par backtrace function names me decode hoga
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Download standard Ethernet library automatically
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2

; Firmware options (sab headers me #ifndef se guard hain), build_flags me -D se badlo:
   -DWEB_FORCE_DEFAULT_PASSWORD=0    ;production: admin123 har boot par wapas nahi
;                                    aayega aur serial par print nahi hoga
;   -DRS485_DE_PIN=<GPIO>            transceiver ka DE/RE pin (default -1 = auto-direction)
;   -DFACTORY_RESET_PIN=<GPIO>       power-on par 5 s LOW rakho -> factory reset
;                                    (strapping pins 0, 2, 4, 5, 12, 15 mat lena)
;   -DDEBUG_SERIAL=0                 saare serial logs band
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Strict warnings sirf hamare src/ code par (core / library par nahi)
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
